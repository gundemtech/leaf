name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Build Leaf (app)
        run: |
          xcodebuild \
            -project Leaf.xcodeproj \
            -scheme Leaf \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build LeafAgent
        run: |
          xcodebuild \
            -project Leaf.xcodeproj \
            -scheme LeafAgent \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build LeafMCP
        run: |
          xcodebuild \
            -project Leaf.xcodeproj \
            -scheme LeafMCP \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test LeafCore package (fresh-clone simulation, only tracked files)
        run: |
          cd Packages/LeafCore
          swift test
