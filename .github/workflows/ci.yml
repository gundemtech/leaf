name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Build LeafControl (app)
        run: |
          xcodebuild \
            -project LeafControl.xcodeproj \
            -scheme LeafControl \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build LeafControlAgent
        run: |
          xcodebuild \
            -project LeafControl.xcodeproj \
            -scheme LeafControlAgent \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build LeafControlMCP
        run: |
          xcodebuild \
            -project LeafControl.xcodeproj \
            -scheme LeafControlMCP \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test LeafControlCore package (fresh-clone simulation, only tracked files)
        run: |
          cd Packages/LeafControlCore
          swift test
