name: leak-guard

# OSS leak guard — fails any PR or push to the dev trunk / main that re-introduces
# a forbidden pattern (team-member names, tuned moat numerics, secrets, tracked
# moat source, hardcoded signing identity). Two layers: the bespoke
# scripts/leak-guard.sh (moat/name/pragma patterns) + gitleaks (generic secrets,
# pinned binary — no org-license action). gitleaks lives here + in `just preflight`,
# never in the pre-push hook (that stays leak-guard-only for speed).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  leak-guard:
    name: OSS leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the guard (detect cases + carve-out controls)
        run: ./scripts/tests/test-leak-guard.sh

      - name: Scan tracked tree for forbidden patterns
        env:
          LEAF_LEAK_GUARD_FIXTURES_ONLY: "0"  # never let the scan be narrowed to fixtures
        run: ./scripts/leak-guard.sh --report

      - name: Install gitleaks (pinned binary — gitleaks-action@v2 needs a paid org license)
        run: |
          ver=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks secret scan (tracked tree)
        run: ./scripts/gitleaks-scan.sh

      # Hygiene guards (R3 + token-discipline) — enforced in CI, not just local
      # `just preflight`. Closes the parallel-work gap that produced the
      # M024↔M028 migration-number split. Both are Bash-3.2/ubuntu-portable.
      - name: Migration-linearity guard self-test (R3 regression)
        run: ./scripts/tests/test-check-migrations.sh

      - name: Migration linearity (R3)
        run: ./scripts/check-migrations.sh

      - name: Token-discipline (Track 2)
        run: ./scripts/check-tokens.sh
