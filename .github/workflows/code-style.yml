name: code-style
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  style:
    name: Format & lint (report-only)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Tool versions
        run: |
          xcrun swift-format --version
          xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint version
        run: swiftlint version

      - name: swift-format lint
        id: fmt
        continue-on-error: true
        run: |
          xcrun swift-format lint --strict --recursive \
            Leaf LeafAgent LeafMCP \
            Packages/LeafCore/Sources Packages/LeafCore/Tests \
            2>&1 | tee swift-format.log

      - name: SwiftLint
        id: lint
        continue-on-error: true
        run: |
          swiftlint lint \
            --config .swiftlint.yml \
            --baseline .swiftlint-baseline.json \
            --reporter github-actions-logging

      - name: Style summary
        if: always()
        run: |
          fmt_count=$(wc -l < swift-format.log 2>/dev/null | tr -d ' ' || echo "?")
          {
            echo "## Style check (Phase 1 — report-only)"
            echo ""
            echo "| Tool | Outcome | Violations |"
            echo "|---|---|---|"
            echo "| swift-format | \`${{ steps.fmt.outcome }}\` | ${fmt_count} (see step log; Phase 2 cleanup roadmap) |"
            echo "| SwiftLint | \`${{ steps.lint.outcome }}\` | 0 new (vs baseline; existing grandfathered in .swiftlint-baseline.json) |"
            echo ""
            echo "SwiftLint violations отображены как PR annotations (Files-changed view)."
            echo "swift-format violations — в raw step log (нет baseline mechanism; Phase 2 cleanup PR через \`just format\`)."
            echo "Phase 1 — **report-only**; merge не блокируется."
            echo ""
            echo "См. [STYLE.md](https://github.com/${{ github.repository }}/blob/main/STYLE.md) и [.swiftlint.yml](https://github.com/${{ github.repository }}/blob/main/.swiftlint.yml)."
          } >> $GITHUB_STEP_SUMMARY
